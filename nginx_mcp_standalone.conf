# RAGFlow MCP Server - Standalone Nginx HTTPS Configuration
# Based on docker/nginx/ragflow.https.conf + docker/nginx/proxy.conf
# No external dependencies - all settings inline

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name ddbmcp.xiaofeifei.fun;
    return 301 https://$host$request_uri;
}

# HTTPS server for MCP
server {
    listen 443 ssl;
    server_name ddbmcp.xiaofeifei.fun;

    # SSL certificates
    ssl_certificate /home/xiaofeifei/.acme.sh/xiaofeifei.fun_ecc/fullchain.cer;
    ssl_certificate_key /home/xiaofeifei/.acme.sh/xiaofeifei.fun_ecc/xiaofeifei.fun.key;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Logging
    access_log /var/log/nginx/mcp_access.log;
    error_log /var/log/nginx/mcp_error.log;

    # MCP SSE endpoint (legacy)
    location /sse {
        proxy_pass http://127.0.0.1:9382;

        # Proxy headers (from docker/nginx/proxy.conf)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # SSE specific
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Buffers (from docker/nginx/proxy.conf)
        proxy_buffer_size 1024k;
        proxy_buffers 16 1024k;
        proxy_busy_buffers_size 2048k;
        proxy_temp_file_write_size 2048k;
    }

    # MCP Streamable HTTP endpoint (recommended)
    location /mcp {
        proxy_pass http://127.0.0.1:9382;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Streaming specific
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Buffers
        proxy_buffer_size 1024k;
        proxy_buffers 16 1024k;
        proxy_busy_buffers_size 2048k;
        proxy_temp_file_write_size 2048k;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:9382;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default
    location / {
        return 404 "MCP Server endpoints: /sse, /mcp, /health";
    }
}
