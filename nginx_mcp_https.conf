# RAGFlow MCP Server - Nginx HTTPS Reverse Proxy Configuration
# Domain: ddbmcp.xiaofeifei.fun
#
# This configuration should be placed in /etc/nginx/sites-available/
# and symlinked to /etc/nginx/sites-enabled/
#
# Installation:
#   sudo cp nginx_mcp_https.conf /etc/nginx/sites-available/mcp-ragflow
#   sudo ln -s /etc/nginx/sites-available/mcp-ragflow /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ddbmcp.xiaofeifei.fun;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server for MCP
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ddbmcp.xiaofeifei.fun;

    # SSL Certificate Configuration
    ssl_certificate /home/xiaofeifei/.acme.sh/xiaofeifei.fun_ecc/fullchain.cer;
    ssl_certificate_key /home/xiaofeifei/.acme.sh/xiaofeifei.fun_ecc/xiaofeifei.fun.key;

    # SSL Security Settings (Modern Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL Session Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /home/xiaofeifei/.acme.sh/xiaofeifei.fun_ecc/fullchain.cer;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/mcp_access.log;
    error_log /var/log/nginx/mcp_error.log;

    # MCP Server - SSE endpoint (legacy transport)
    location /sse {
        proxy_pass http://127.0.0.1:9382;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE specific settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;  # Critical for SSE
        proxy_cache off;
        proxy_read_timeout 86400s;  # 24 hours for long-lived SSE connections
        proxy_send_timeout 86400s;

        # Chunked transfer encoding
        chunked_transfer_encoding on;

        # CORS headers (if needed for web clients)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    # MCP Server - Streamable HTTP endpoint (modern transport)
    location /mcp {
        proxy_pass http://127.0.0.1:9382;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 for streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;  # Critical for streaming
        proxy_cache off;
        proxy_read_timeout 3600s;  # 1 hour timeout
        proxy_send_timeout 3600s;

        # Larger buffers for MCP protocol
        proxy_buffer_size 1024k;
        proxy_buffers 16 1024k;
        proxy_busy_buffers_size 2048k;

        # CORS headers (if needed for web clients)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:9382;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default location - return 404
    location / {
        return 404 "MCP Server - Use /sse or /mcp endpoints";
    }
}
