# RAGFlow MCP Server - Nginx HTTPS Configuration
# Based on docker/nginx/ragflow.https.conf
# Modified for host nginx to proxy MCP server

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name ddbmcp.xiaofeifei.fun;
    return 301 https://$host$request_uri;
}

# HTTPS server for MCP
server {
    listen 443 ssl;
    server_name ddbmcp.xiaofeifei.fun;

    # SSL certificates (host machine path, not Docker path)
    ssl_certificate /home/xiaofeifei/.acme.sh/xiaofeifei.fun_ecc/fullchain.cer;
    ssl_certificate_key /home/xiaofeifei/.acme.sh/xiaofeifei.fun_ecc/xiaofeifei.fun.key;

    # Optional: Enhanced SSL configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Logging
    access_log /var/log/nginx/mcp_access.log;
    error_log /var/log/nginx/mcp_error.log;

    # MCP SSE endpoint (legacy)
    location /sse {
        proxy_pass http://127.0.0.1:9382;
        include /etc/nginx/proxy.conf;  # Reuse existing proxy.conf if available

        # SSE specific: disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # MCP Streamable HTTP endpoint (recommended)
    location /mcp {
        proxy_pass http://127.0.0.1:9382;
        include /etc/nginx/proxy.conf;  # Reuse existing proxy.conf if available

        # Streaming: disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:9382;
        include /etc/nginx/proxy.conf;
    }

    # Default: 404
    location / {
        return 404 "MCP Server endpoints: /sse, /mcp, /health";
    }
}
